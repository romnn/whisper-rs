[package]
name = "whisper-rs-sys"
version = "0.15.0"
edition = "2021"
rust-version.workspace = true
description = "Rust bindings for whisper.cpp (FFI bindings)"
license = "Unlicense"
documentation = "https://docs.rs/whisper-rs-sys"
repository = "https://codeberg.org/tazz4843/whisper-rs"
links = "whisper"
include = [
	"whisper.cpp/bindings/javascript/package-tmpl.json",
	"whisper.cpp/bindings/CMakeLists.txt",
	"whisper.cpp/CMakeLists.txt",
	"whisper.cpp/cmake",
	"whisper.cpp/src/**",
	"whisper.cpp/include/whisper.h",
	"whisper.cpp/ggml/cmake",
	"whisper.cpp/ggml/CMakeLists.txt",
	"whisper.cpp/ggml/src/**",
	"whisper.cpp/ggml/include/*.h",
	"whisper.cpp/LICENSE",
	"src/*.rs",
	"build.rs",
	"wrapper.h",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Optional shared-ggml backend, activated by the `system-ggml` feature.
# When enabled, build.rs reads the install path from `DEP_GGML_CMAKE_PREFIX_PATH`
# and passes it to CMake as `CMAKE_PREFIX_PATH`, so whisper.cpp's
# `find_package(ggml REQUIRED)` (triggered by `WHISPER_USE_SYSTEM_GGML=ON`)
# resolves against the externally-built ggml instead of the bundled copy.
ggml-sys = { version = "*", optional = true }

[features]
# Backend selection. When `system-ggml` is also enabled, each backend feature
# propagates into ggml-sys via `ggml-sys?/<backend>` (the `?` only activates
# the feature if ggml-sys is already in the dep graph), so the externally-
# built libggml has matching backend symbols.
coreml = []
cuda = ["ggml-sys?/cuda"]
hipblas = ["ggml-sys?/hipblas"]
openblas = []
metal = ["ggml-sys?/metal"]
vulkan = ["ggml-sys?/vulkan"]
force-debug = []
openmp = ["ggml-sys?/openmp"]
intel-sycl = []
system-ggml = ["dep:ggml-sys"]

[build-dependencies]
cmake = "0.1"
bindgen = "0.72"
cfg-if = "1"
fs_extra = "1.3"
semver = "1.0"
